<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Universal Data Inspector</title>
  <style>body{font-family:Arial,sans-serif;max-width:860px;margin:40px auto;padding:0 20px;color:#222}code{background:#f3f3f3;padding:2px 5px}pre{background:#f6f8fa;padding:16px;overflow:auto}.ok{color:#167c2f}.bad{color:#b42318}</style>
</head>
<body>
  <h1>Universal Data Inspector</h1>
  <p>This directory is the hosted root of an ArcGIS Web AppBuilder 2.19 custom widget.</p>
  <p>Portal manifest URL: <a href="manifest.json"><code>manifest.json</code></a></p>
  <h2>Self-check</h2>
  <div id="status">Checking files…</div>
  <pre id="details"></pre>
<script>
(function(){
  var files=['manifest.json','Widget.js','Widget.html','config.json','css/style.css','setting/Setting.js','setting/Setting.html'];
  Promise.all(files.map(function(path){return fetch(path,{cache:'no-store'}).then(function(r){return {path:path,ok:r.ok,status:r.status,type:r.headers.get('content-type')||''};}).catch(function(e){return {path:path,ok:false,status:0,type:String(e)};});})).then(function(results){
    var ok=results.every(function(x){return x.ok;});
    document.getElementById('status').className=ok?'ok':'bad';
    document.getElementById('status').textContent=ok?'All required public files are reachable.':'One or more required files are missing.';
    document.getElementById('details').textContent=JSON.stringify(results,null,2);
  });
}());
</script>
</body>
</html>
