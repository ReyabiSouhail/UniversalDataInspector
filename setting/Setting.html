<div class="udi-setting">
  <div class="udi-setting-section">
    <h3>Available map sources</h3>
    <div data-dojo-attach-point="sourcesNode" class="udi-setting-sources"></div>
  </div>
  <div class="udi-setting-section">
    <h3>Widget configuration JSON</h3>
    <p class="udi-help">Auto mode works immediately. For an advanced workflow, copy a source selector from the list and edit the steps.</p>
    <textarea data-dojo-attach-point="configEditorNode" class="udi-setting-editor" spellcheck="false"></textarea>
    <div data-dojo-attach-point="validationNode" class="udi-setting-validation"></div>
  </div>
</div>
