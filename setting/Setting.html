<div class="jimu-widget-setting-universal-data-inspector">
  <div class="udi-setting-note">${nls.instructions}</div>
  <div class="udi-setting-actions">
    <button class="jimu-btn" data-dojo-attach-event="onclick:_insertExample">${nls.insertExample}</button>
    <button class="jimu-btn" data-dojo-attach-event="onclick:_validateConfig">${nls.validate}</button>
  </div>
  <label class="udi-setting-label" for="udiConfigText">${nls.configuration}</label>
  <textarea class="udi-config-editor" data-dojo-attach-point="configTextNode" id="udiConfigText"></textarea>
  <div class="udi-validation" data-dojo-attach-point="validationNode"></div>
</div>
